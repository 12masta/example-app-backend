name: Security ZAP

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly Sunday 04:00 UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: security-zap-${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  zap:
    name: OWASP ZAP API scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AGENT_HUB_DISPATCH_URL: ${{ secrets.AGENT_HUB_DISPATCH_URL }}
      DISPATCH_KEY: ${{ secrets.DISPATCH_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build API (Release)
        run: dotnet build -c Release src/Conduit/Conduit.csproj

      - name: Start API
        run: |
          mkdir -p zap-work
          nohup env ASPNETCORE_URLS=http://localhost:5080 \
            dotnet run --no-launch-profile --no-build -c Release \
            --project src/Conduit/Conduit.csproj \
            > "${RUNNER_TEMP}/api.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/api.pid"

      - name: Wait for API
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:5080/api/tags >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready"
          if [ -f "${RUNNER_TEMP}/api.log" ]; then
            cat "${RUNNER_TEMP}/api.log"
          fi
          exit 1

      - name: Download OpenAPI from running API
        run: |
          mkdir -p zap-work
          curl -fsS http://localhost:5080/swagger/v1/swagger.json -o zap-work/openapi.json
          test -s zap-work/openapi.json
          # ASP.NET emits relative server "/"; ZAP needs an absolute base URL.
          node <<'NODE'
          const fs = require('fs');
          const path = 'zap-work/openapi.json';
          const spec = JSON.parse(fs.readFileSync(path, 'utf8'));
          spec.servers = [{ url: 'http://localhost:5080' }];
          fs.writeFileSync(path, JSON.stringify(spec, null, 2));
          console.log('OpenAPI servers set to http://localhost:5080; paths=', Object.keys(spec.paths || {}).length);
          NODE

      - name: OWASP ZAP API Scan
        id: zap
        continue-on-error: true
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          format: openapi
          target: 'zap-work/openapi.json'
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-api-scan-raw

      - name: Record ZAP conclusion
        id: zap_status
        if: always()
        run: |
          if [ "${{ steps.zap.outcome }}" = "success" ]; then
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            echo "conclusion=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect Agent Hub security artifact
        if: always()
        run: |
          mkdir -p agent-hub-artifact/zap agent-hub-artifact/openapi agent-hub-artifact/logs

          if [ -f report_json.json ]; then
            cp -f report_json.json agent-hub-artifact/zap/report.json
          elif [ -f zap-work/report_json.json ]; then
            cp -f zap-work/report_json.json agent-hub-artifact/zap/report.json
          fi

          if [ -f report_html.html ]; then
            cp -f report_html.html agent-hub-artifact/zap/report.html
          elif [ -f zap-work/report_html.html ]; then
            cp -f zap-work/report_html.html agent-hub-artifact/zap/report.html
          fi

          if [ -f report_md.md ]; then
            cp -f report_md.md agent-hub-artifact/zap/report.md
          fi

          if [ -f zap-work/openapi.json ]; then
            cp -f zap-work/openapi.json agent-hub-artifact/openapi/openapi.json
          fi

          if [ -f "${RUNNER_TEMP}/api.log" ]; then
            tail -c 524288 "${RUNNER_TEMP}/api.log" > agent-hub-artifact/logs/api.log || true
          fi

      - name: Build Agent Hub security manifest
        if: always()
        run: |
          node tools/agent-hub-manifest/build-security-manifest.mjs \
            --agent security-test-analysis \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow "$GITHUB_WORKFLOW" \
            --job zap \
            --commit "$GITHUB_SHA" \
            --conclusion "${{ steps.zap_status.outputs.conclusion || job.status }}" \
            --out-dir agent-hub-artifact

      - name: Upload Agent Hub security artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-hub-security-v1
          path: agent-hub-artifact
          if-no-files-found: warn
          retention-days: 14

      - name: Dispatch Security Test Analysis
        if: ${{ always() && env.AGENT_HUB_DISPATCH_URL != '' && env.DISPATCH_KEY != '' }}
        run: |
          test -n "$AGENT_HUB_DISPATCH_URL"
          test -n "$DISPATCH_KEY"
          curl -fsS -X POST "$AGENT_HUB_DISPATCH_URL" \
            -H "x-agent-hub-key: ${DISPATCH_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"agentSlug\":\"security-test-analysis\",\"source\":{\"type\":\"github-actions\",\"repository\":\"${GITHUB_REPOSITORY}\",\"workflowRunId\":${GITHUB_RUN_ID},\"runAttempt\":${GITHUB_RUN_ATTEMPT},\"artifactName\":\"agent-hub-security-v1\"}}"

      - name: Exit with ZAP status
        if: always()
        run: |
          code="${{ steps.zap_status.outputs.exit_code }}"
          exit "${code:-1}"
