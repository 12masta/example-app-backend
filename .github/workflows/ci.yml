name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-coverage:
    name: Unit coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302

      - name: Format, build, and test
        run: dotnet run --project build/build.csproj -- test

      - name: Assert slice coverage is not empty
        run: python3 tests/assert-cobertura-not-empty.py 'artifacts/coverage/slice/**/coverage.cobertura.xml'

      - name: Upload slice coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: slice-cobertura
          path: artifacts/coverage/slice/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 14

  api-spec:
    name: RealWorld API spec (Hurl)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302

      - name: Install Hurl
        run: |
          curl -sSL https://github.com/Orange-OpenSource/hurl/releases/download/8.0.1/hurl-8.0.1-x86_64-unknown-linux-gnu.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/hurl-8.0.1-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"

      - name: Run Hurl tests
        run: make test-hurl-with-managed-server
