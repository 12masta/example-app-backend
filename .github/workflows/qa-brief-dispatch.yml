name: QA Brief dispatch

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Queue QA Brief job
        env:
          AGENT_HUB_DISPATCH_URL: ${{ secrets.AGENT_HUB_DISPATCH_URL }}
          DISPATCH_KEY: ${{ secrets.DISPATCH_KEY }}
        run: |
          test -n "$AGENT_HUB_DISPATCH_URL"
          test -n "$DISPATCH_KEY"
          curl -fsS -X POST "$AGENT_HUB_DISPATCH_URL" \
            -H "x-agent-hub-key: ${DISPATCH_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"owner\":\"${{ github.repository_owner }}\",\"repo\":\"${{ github.event.repository.name }}\",\"pr_number\":\"${{ github.event.pull_request.number }}\"}"
