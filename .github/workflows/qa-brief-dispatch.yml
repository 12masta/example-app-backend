name: QA Brief dispatch

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Queue central QA Brief
        env:
          GH_TOKEN: ${{ secrets.QA_BRIEF_DISPATCH_TOKEN }}
        run: |
          gh workflow run qa-brief.yml \
            --repo 12masta/example-ai-qa-brief \
            -f owner="${{ github.repository_owner }}" \
            -f repo="${{ github.event.repository.name }}" \
            -f pr_number="${{ github.event.pull_request.number }}"
